schema_version: 1

title: Audio-visual digit classification
slug: audio_visual_digit_classification
summary: >-
  Classify spoken-and-written digits from paired audio and image inputs, comparing late fusion,
  low-rank tensor fusion and bimodal interaction fusion on AVMNIST.

domain: others
task: multimodal classification

modality:
  - image
  - audio
method:
  - Multimodal Neural Network
  - Late fusion
  - Low-rank tensor fusion
  - Bimodal interaction fusion
fusion: late
difficulty: intermediate

dataset:
  - name: AVMNIST (subset, labels 0 and 1)
    url: https://drive.google.com/file/d/1N5k-LvLwLbPBgn3GdVg6fXMBIR6pYrKb/view
    size: 20 MB
    auto_download: false

kale_api:
  - kale.embed.image_cnn
  - kale.embed.multimodal_fusion
  - kale.loaddata.avmnist_datasets
  - kale.pipeline.base_nn_trainer
  - kale.predict.decode

source_example: avmnist_multimodal
entry_point: main.py
run_command: python main.py --cfg configs/late_fusion.yaml --output AVMNIST-LATE

hardware: cpu
estimated_runtime: ~10 min on CPU

colab: true
binder: true
draft: true

references:
  - https://github.com/pliang279/MultiBench
