schema_version: 1

title: Domain adaptation on synthetic data
slug: synthetic_domain_adaptation
summary: >-
  The smallest possible domain adaptation example. Two blob-generated domains, two classes, and a
  CoIRLS classifier -- runs in seconds and makes the covariate-shift problem visible in one plot.

domain: others
task: classification

modality:
  - tabular
method:
  - CoIRLS
fusion: none
difficulty: beginner

dataset:
  - name: Synthetic blobs (sklearn.datasets.make_blobs)
    auto_download: true

kale_api:
  - kale.interpret.visualize
  - kale.pipeline.multi_domain_adapter

source_example: toy_domain_adaptation
entry_point: main.py
run_command: python main.py

hardware: cpu
estimated_runtime: <1 min on CPU

colab: true
binder: true
draft: true

references:
  - https://ojs.aaai.org//index.php/AAAI/article/view/6179
