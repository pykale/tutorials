# Hook versions are pinned for reproducible formatting and a working local setup.
repos:
-   repo: https://github.com/datarootsio/databooks
    rev: 1.3.7
    hooks:
    -   id: databooks-meta

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
    -   id: check-added-large-files
        args: ['--maxkb=300']
    -   id: check-byte-order-marker
    -   id: check-case-conflict
    -   id: check-merge-conflict
    -   id: end-of-file-fixer
    -   id: forbid-new-submodules
    -   id: mixed-line-ending
    -   id: trailing-whitespace
    -   id: debug-statements
        exclude: ^(others|protein|cancer|cardiac|materials)/
    -   id: check-yaml
    -   id: requirements-txt-fixer

-   repo: https://github.com/pycqa/flake8.git
    rev: 6.1.0
    hooks:
    -   id: flake8
        additional_dependencies: [flake8-print, "importlib-metadata<5.0.0"]
        args: [--config=setup.cfg]
        # Migrated example code is kept byte-identical to upstream pykale/examples, which is itself
        # excluded from flake8 there. Only plot_<slug>.py, authored here, is linted.
        exclude: ^(others|protein|cancer|cardiac|materials)/(?!.*plot_[^/]+\.py$).*

-   repo: https://github.com/psf/black
    rev: 23.11.0
    hooks:
    -   id: black
        language_version: python3
        additional_dependencies: ['click==8.0.4']
        exclude: ^(others|protein|cancer|cardiac|materials)/(?!.*plot_[^/]+\.py$).*

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        args: [--settings-path, ./pyproject.toml]
        exclude: ^(others|protein|cancer|cardiac|materials)/(?!.*plot_[^/]+\.py$).*

-   repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.5.0
    hooks:
    -   id: mypy
        files: ^(scripts|source/_shared)/
        additional_dependencies: [pydantic>=2.9, types-PyYAML]
